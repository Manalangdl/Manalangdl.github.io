<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColaMunchies | Reviews</title>

    <link rel="stylesheet" href="css/reviews.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div>
        <header class="navbar flex flex-start flex-column w-100">
            

            <!-- nav bar -->
            <nav class="w-100 flex flex-between">
                <!-- logo -->
                <div id="nav-logo">ColaMunchies</div>

                <ul class="flex nav-list">
                    <a href="index.html">Home</a>
                    <a href="reviews.html">Reviews</a>
                    <a href="top-picks.html">Top Picks</a>
                    <a href="guide.html">Guide</a>
                    <a href="about.html">About</a>
                </ul>
            </nav>

            <!-- HERO -->
            <section class="hero flex flex-center">
                <h1>Check Out Fan Favorites</h1>
            </section>
        </header>

        <main>
            <!-- COMMUNITY REVIEWS/SECT -->
            <section class="review-sect">
                <div class="">
                    <div class="review-h flex flex-between">
                        <h2>FRESH FROM OUR COMMUNITY</h2>
                        <a href="#" class="view-all">View All</a>
                    </div>

                    <div class="review-grid flex flex-evenly">


                    </div>
                    
                </div>
            </section>

            <section class="recommend-sect">
                <div class="container">
                    <h2>Have a Recommended Place?</h2>

                    <div class="form flex">

                        <!-- form -->
                        <div class="form-inputs form-column">
                            <h3>Leave a Review</h3>
                            <div>
                                <label for="name">Name</label>
                                <input type="text" id="name" placeholder="Your name">

                                <label for="email">Email</label>
                                <input type="text" id="email" placeholder="Your email">

                                <label for="restaurant">Restaurant</label>
                                <input type="text" id="restaurant" placeholder="Name of Restaurant">

                                <label for="review">Review</label>
                                <textarea id="review" placeholder="Your review..."></textarea>

                                <button type="submit">Submit Review</button>
                            </div>
                        </div>

                        <!-- IMG UPLOAD -->
                        <div class="upload-column flex flex-column flex-center">
                            <button type="button" class="img-upload">
                                <span>+</span>
                            </button>
                            <p>Add Image (optional)</p>
                        </div>

                        <!-- star rating -->
                        <div class="rating-column flex flex-column flex-center">
                            <h3 id="star-h">Stars</h3>
                            <div class="rating-stars flex">
                                <button type="button">☆</button>
                                <button type="button">☆</button>
                                <button type="button">☆</button>
                                <button type="button">☆</button>
                                <button type="button">☆</button>
                            </div>
                        </div>

                    </div>
                </div>
            </section>


        </main>

        <footer id="footer" class="flex flex-between">
            <!-- logo -->
            <div id="footer-logo" class="flex flex-column flex-between">
                <div id="white-logo">ColaMunchies</div>

                <!-- copyright -->
                <p id="copyright">&copy; 2026 ColaMunchies. All rights reserved.</p>
            </div>
            <!-- socials -->
            <div class="footer-sect flex flex-between flex-column">
                <h3>Follow Along</h3>

                <div class="flex social-links flex-evenly">


                    <a href="#"><img src="home-imgs/facebook.png" alt="Facebook"></a>
                    <a href="#"><img src="home-imgs/insta.png" alt="Instagram"></a>
                    <a href="#"><img src="home-imgs/x.png" alt="X"></a>
                    <a href="#"><img src="home-imgs/youtube.png" alt="YouTube"></a>

                </div>

                <!-- FOOTER NAV -->
                <div class="w-100">    
                    <ul class="footer-nav w-100 flex flex-evenly">
                        <a href="#">Home</a>
                        <a href="#">Reviews</a>
                        <a href="#">Top Foods</a>
                        <a href="#">Guide</a>
                        <a href="#">About</a>
                    </ul>
                </div>
            </div>

        </footer>
        
    </div>
</body>
<script src="scripts/reviews.js"></script>
</html>
