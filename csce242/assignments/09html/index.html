<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Classes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="id01" class="w3-modal">
        <div class="w3-modal-content">
            <div class="modal-container flex flex-evenly ">
                <span onclick="document.getElementById('id01').style.display='none'" class="w3-button w3-display-topright">X</span>
                
                <div class="modal-col">
                    <iframe src="#" 
                    style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>

                <div class="modal-col text">
                    <!-- Title -->
                    <h1 class="title"></h1>

                    <!-- Type -->
                    <p class="type">Type: <span></span></p>

                    <!-- Description -->
                    <p class="des">Description: <span></span></p>

                    <!-- Todo -->
                    <p class="todo">Things To Do: <span></span></p>
                </div>
            </div>
        </div>
    </div>


    <!-- regular webpage -->
    <div id="container">
        <header class="flex flex-center flex-column">
            <h1 class="fs-24">Vacations</h1>
            <h2 class="fs-20">Vacation Experiences</h2>
        </header>

        <!-- vacations go here -->
        <main class="flex flex-evenly">

        </main>

        <footer>
            <p class="fs-16">&copy; lindsaymanalang</p>
        </footer>
    </div>

</body>
<script src="script.js"></script>
</html>
